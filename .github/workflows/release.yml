name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - run: npm run typecheck

      - run: npm run lint

      - name: Validate provider schema compatibility
        run: npm run test:schema-compat

      - run: npx vitest run

      # Workspace builds update the tracked browser/runtime bundles and can
      # create new hashed chunks. Changesets resets tracked files internally,
      # but leaves untracked chunks behind and would add them to the version PR.
      - name: Clean generated bundles before Changesets
        run: |
          git restore --worktree packages/cesium-mcp-runtime/dist packages/cesium-mcp-bridge/dist
          git clean -fd packages/cesium-mcp-runtime/dist packages/cesium-mcp-bridge/dist

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

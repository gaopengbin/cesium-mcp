name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run typecheck

      - run: npm run lint

      - name: Validate provider schema compatibility
        run: npm run test:schema-compat

      - run: npx vitest run

      - name: Run spatial context evaluation
        run: npm run eval:spatial-context
        if: matrix.node-version == 22

      - name: Run world awareness evaluation
        run: npm run eval:world-awareness
        if: matrix.node-version == 22

      - run: npx playwright install --with-deps chromium
        if: matrix.node-version == 22

      - run: npm run test:e2e:packed
        if: matrix.node-version == 22

      - run: npm run test:conformance:mcp
        if: matrix.node-version == 22
